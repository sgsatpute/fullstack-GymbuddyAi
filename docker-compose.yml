version: "3.9"

services:
  app:
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      PORT: 5001
      JWT_SECRET: change-me-before-production
      DB_PATH: /app/server/gymbuddy.db
      DATABASE_URL: postgres://gymbuddy:gymbuddy@postgres:5432/gymbuddy
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gymbuddy
      POSTGRES_USER: gymbuddy
      POSTGRES_PASSWORD: gymbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
