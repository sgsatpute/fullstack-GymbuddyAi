services:
  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PORT: 5001
      JWT_SECRET: local-dev-secret-change-me-local-dev-secret
      DB_PATH: server/gymbuddy.db
      DATABASE_URL: postgres://gymbuddy:gymbuddy@postgres:5432/gymbuddy
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: 7
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gymbuddy
      POSTGRES_USER: gymbuddy
      POSTGRES_PASSWORD: gymbuddy
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
