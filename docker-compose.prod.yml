version: "3.9"

services:
  app:
    build: .
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET}
      DB_PATH: /app/server/gymbuddy.db
      DATABASE_URL: postgres://gymbuddy:${POSTGRES_PASSWORD}@postgres:5432/gymbuddy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: gymbuddy
      POSTGRES_USER: gymbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
